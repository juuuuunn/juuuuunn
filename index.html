<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>将棋定跡アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>将棋定跡</h1>
  </header>

  <main>
    <aside class="sidebar-left">
      <h2>定跡一覧</h2>
      <ul id="opening-list"></ul>
    </aside>

    <section class="board-section">
      <div class="board-wrapper">
        <div class="file-header">
          <span>９</span><span>８</span><span>７</span><span>６</span>
          <span>５</span><span>４</span><span>３</span><span>２</span><span>１</span>
        </div>
        <div class="board-inner">
          <div id="shogi-board" class="shogi-board"></div>
          <div class="rank-labels">
            <span>一</span><span>二</span><span>三</span><span>四</span>
            <span>五</span><span>六</span><span>七</span><span>八</span><span>九</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="btn-first" title="最初へ">&#9664;&#9664;</button>
        <button id="btn-prev" title="前の手">&#9664;</button>
        <span id="move-counter">0 / 0</span>
        <button id="btn-next" title="次の手">&#9654;</button>
        <button id="btn-last" title="最後へ">&#9654;&#9654;</button>
      </div>

      <div id="hand-area" class="hand-area">
        <div class="hand-box" id="hand-gote">
          <span class="hand-label">後手持ち駒</span>
          <div class="hand-pieces" id="hand-gote-pieces"></div>
        </div>
        <div class="hand-box" id="hand-sente">
          <span class="hand-label">先手持ち駒</span>
          <div class="hand-pieces" id="hand-sente-pieces"></div>
        </div>
      </div>
    </section>

    <aside class="sidebar-right">
      <h2 id="opening-title">定跡を選択してください</h2>
      <p id="opening-desc" class="opening-desc"></p>
      <div id="move-list-wrapper">
        <ol id="move-list"></ol>
      </div>
    </aside>
  </main>

  <!-- 駒SVG共通グラデーション・フィルター定義（非表示） -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <!-- 先手駒ボディ: クリーム→琥珀 -->
      <linearGradient id="grad-sente" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#FFFCE8"/>
        <stop offset="60%" stop-color="#F8D860"/>
        <stop offset="100%" stop-color="#E8A820"/>
      </linearGradient>
      <!-- 後手駒ボディ: ラベンダー→紫 -->
      <linearGradient id="grad-gote" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#F4EEFF"/>
        <stop offset="60%" stop-color="#A870E8"/>
        <stop offset="100%" stop-color="#6830C0"/>
      </linearGradient>
      <!-- 光沢ハイライト -->
      <linearGradient id="grad-gloss" x1="0%" y1="0%" x2="10%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.80)"/>
        <stop offset="55%" stop-color="rgba(255,255,255,0.20)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>
      <!-- 成り駒グロウフィルター -->
      <filter id="filter-promoted" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
        <feFlood flood-color="#FF2200" flood-opacity="0.55" result="col"/>
        <feComposite in="col" in2="blur" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- 移動先ハイライト（金色光） -->
      <radialGradient id="grad-highlight" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="rgba(255,220,0,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,180,0,0)"/>
      </radialGradient>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
